name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint → Typecheck → Test → Build → Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test with coverage
        run: npx vitest run --coverage

      - name: Build
        run: npx vite build

      - name: Verify secrets
        run: bash scripts/verify-secrets.sh

      - name: Verify package
        run: bash scripts/verify-package.sh

      - name: Verify no .env in dist
        run: |
          if find dist -name '.env*' 2>/dev/null | grep -q .; then
            echo "FAIL: .env found in build output"
            exit 1
          fi
          echo "OK: no .env in dist/"
