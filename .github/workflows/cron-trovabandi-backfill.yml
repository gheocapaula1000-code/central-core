name: Cron TrovaBandi backfill

# Fallback if pg_cron / pg_net on Lovable Cloud jpunn misses a run.
# Hits live Core trovabandi-engine only.
# Required secrets (repo Settings → Secrets and variables → Actions):
#   SUPABASE_URL              e.g. https://jpunnzgixcghuydstdlt.supabase.co
#   CENTRAL_CORE_JOB_SECRET   same value as edge function env
#
# Live engine idle timeout is 150s: one round of 8 succeeds (~24s), 40 504s.
# Hourly weekday rounds of 8. Never echo CENTRAL_CORE_JOB_SECRET.
# max_batch is a packet size, not official-PDF BFS depth (engine DETAIL_MAX_FETCH_PER_HIT=8).
# After PR 71 cookie/empty rotates increment skipped, not updated — stop only when processed=0.
# Sleep ~20s between rounds so the Lovable worker can reclaim memory (HTTP 546 WORKER_RESOURCE_LIMIT).
# Default 6 rounds: 15 stacked on one worker OOM'd. Input still overridable.

on:
  schedule:
    # Weekdays 08:50–18:50 Europe/Rome (CEST = UTC+2)
    - cron: "50 6-16 * * 1-5"
    # 01:20 Europe/Rome weekdays — backup if jpunn pg_cron 01:10 missed
    - cron: "20 23 * * 0-4"
  workflow_dispatch:
    inputs:
      max_batch:
        description: "Opportunities per round (live jpunn CPU: use 1; packet size not PDF depth)"
        required: false
        type: string
        default: "1"
      rounds:
        description: "How many rounds of max_batch in this job (default 6; safer for one Lovable worker)"
        required: false
        type: string
        default: "6"

permissions:
  contents: read

concurrency:
  group: cron-trovabandi-backfill
  cancel-in-progress: false

jobs:
  backfill:
    name: TrovaBandi backfill
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: POST trovabandi-engine status then backfill_nulls rounds
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          JOB_SECRET: ${{ secrets.CENTRAL_CORE_JOB_SECRET }}
          MAX_BATCH: ${{ github.event.inputs.max_batch || '1' }}
          ROUNDS: ${{ github.event.inputs.rounds || '6' }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${JOB_SECRET:-}" ]; then
            echo "Missing SUPABASE_URL or CENTRAL_CORE_JOB_SECRET"
            exit 1
          fi
          if [[ "${SUPABASE_URL}" != *jpunnzgixcghuydstdlt* ]]; then
            echo "REFUSE: SUPABASE_URL is not live Core jpunnzgixcghuydstdlt"
            HOST="${SUPABASE_URL#https://}"
            HOST="${HOST#http://}"
            HOST="${HOST%%/*}"
            echo "SUPABASE_URL host: ${HOST}"
            exit 1
          fi
          HOST="${SUPABASE_URL#https://}"
          HOST="${HOST#http://}"
          HOST="${HOST%%/*}"
          echo "SUPABASE_URL host: ${HOST}"

          N="${MAX_BATCH:-1}"
          if ! [[ "${N}" =~ ^[0-9]+$ ]] || [ "${N}" -lt 1 ]; then
            echo "Invalid max_batch '${N}', using 1"
            N=1
          fi
          # Live jpunn returns HTTP 546 CPU Time exceeded unless the packet is 1.
          # DETAIL_MAX_FETCH_PER_HIT stays 8 (PDF depth is unchanged; only packet size drops).
          # Live jpunn idle-timeout 150s: 40 504s, 8 succeeds. Cap until engine budget is published.
          if [ "${N}" -gt 8 ]; then
            echo "Capping max_batch ${N} -> 8 (live 150s idle timeout)"
            N=8
          fi
          R="${ROUNDS:-6}"
          if ! [[ "${R}" =~ ^[0-9]+$ ]] || [ "${R}" -lt 1 ]; then
            echo "Invalid rounds '${R}', using 6"
            R=6
          fi
          if [ "${R}" -gt 20 ]; then
            echo "Capping rounds ${R} -> 20"
            R=20
          fi

          URL="${SUPABASE_URL%/}/functions/v1/trovabandi-engine"
          echo "POST ${URL}"

          echo "=== status"
          STATUS_HTTP="000"
          s=1
          while [ "${s}" -le 3 ]; do
            STATUS_HTTP=$(curl -sS -o /tmp/tb_status.json -w "%{http_code}" \
              -X POST "$URL" \
              -H "Content-Type: application/json" \
              -H "x-job-secret: ${JOB_SECRET}" \
              -H "x-internal-secret: ${JOB_SECRET}" \
              --max-time 60 \
              -d '{"action":"status"}' || echo "000")
            echo "status attempt ${s}/3 HTTP ${STATUS_HTTP}"
            head -c 4000 /tmp/tb_status.json || true
            echo
            if [ "${STATUS_HTTP}" = "200" ]; then
              break
            fi
            if [ "${s}" -lt 3 ]; then
              echo "status not 200, sleep 20s and retry"
              sleep 20
            fi
            s=$((s + 1))
          done
          if [ "${STATUS_HTTP}" != "200" ]; then
            echo "status still not 200 after 3 attempts (HTTP ${STATUS_HTTP}); SKIPPING backfill_nulls to avoid POSTing into a dead worker"
            exit 1
          fi

          OK_ROUNDS=0
          i=1
          while [ "${i}" -le "${R}" ]; do
            BODY=$(printf '{"action":"backfill_nulls","max_batch":%s,"dry_run":false,"allow_paid_extract":false,"trigger_source":"github_actions"}' "${N}")
            echo "=== backfill_nulls round ${i}/${R} max_batch=${N}"
            HTTP=$(curl -sS -o /tmp/tb_backfill.json -w "%{http_code}" \
              -X POST "$URL" \
              -H "Content-Type: application/json" \
              -H "x-job-secret: ${JOB_SECRET}" \
              -H "x-internal-secret: ${JOB_SECRET}" \
              --max-time 180 \
              -d "${BODY}" || echo "000")
            echo "HTTP ${HTTP}"
            head -c 4000 /tmp/tb_backfill.json || true
            echo
            case "$HTTP" in
              200|202) OK_ROUNDS=$((OK_ROUNDS + 1)) ;;
              *) echo "STOP round ${i} HTTP ${HTTP}"; break ;;
            esac
            UPDATED=$(python3 -c "import json; d=json.load(open('/tmp/tb_backfill.json')); print(int(d.get('updated') or 0))" 2>/dev/null || echo 0)
            PROCESSED=$(python3 -c "import json; d=json.load(open('/tmp/tb_backfill.json')); print(int(d.get('processed') or 0))" 2>/dev/null || echo 0)
            SKIPPED=$(python3 -c "import json; d=json.load(open('/tmp/tb_backfill.json')); print(int(d.get('skipped') or 0))" 2>/dev/null || echo 0)
            echo "round ${i} processed=${PROCESSED} updated=${UPDATED} skipped=${SKIPPED}"
            # Cookie/empty rotates (PR 71) increment skipped, not updated.
            # Stop only when the engine processed nobody this round.
            # Continue if skipped>0 even when updated=0.
            if [ "${PROCESSED}" = "0" ]; then
              echo "No more rows processed, stopping"
              break
            fi
            if [ "${i}" -lt "${R}" ]; then
              echo "sleep 20s to let jpunn worker reclaim memory"
              sleep 20
            fi
            i=$((i + 1))
          done
          echo "OK_ROUNDS=${OK_ROUNDS}"
          if [ "${OK_ROUNDS}" -lt 1 ]; then
            echo "FAIL no successful backfill_nulls round"
            exit 1
          fi
